<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>王裕 | ID 与 UX 设计师简历</title>
    <meta name="description" content="王裕 ID 与 UX 设计师 2027 校招简历在线预览">
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2933;
        --muted: #607080;
        --line: #d8e0e8;
        --paper: #f6f8fb;
        --panel: #ffffff;
        --accent: #0969da;
        --accent-strong: #0757b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px clamp(16px, 4vw, 40px);
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
      }

      .title {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 2.5vw, 28px);
        font-weight: 700;
        line-height: 1.2;
      }

      p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-shrink: 0;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: var(--panel);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }

      .button.primary {
        border-color: var(--accent);
        color: #ffffff;
        background: var(--accent);
      }

      .button.primary:hover {
        background: var(--accent-strong);
      }

      .viewer {
        height: calc(100vh - 77px);
        padding: clamp(10px, 2vw, 20px);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      @media (max-width: 720px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .actions {
          width: 100%;
        }

        .button {
          flex: 1;
        }

        .viewer {
          height: calc(100vh - 140px);
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="title">
        <h1>王裕 | ID 与 UX 设计师简历</h1>
        <p>2027 校招 · 清华硕士</p>
      </div>
      <nav class="actions" aria-label="简历操作">
        <a class="button" href="resume.pdf" target="_blank" rel="noopener">打开 PDF</a>
        <a class="button primary" href="resume.pdf" download>下载简历</a>
      </nav>
    </header>
    <main class="viewer">
      <iframe src="resume.pdf#view=FitH" title="王裕简历 PDF 预览"></iframe>
    </main>
  </body>
</html>
