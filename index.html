<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <meta name="description" content="王裕个人作品集在线预览">
    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;
        --ink: #f5f1ea;
        --muted: #a9a39a;
        --line: rgba(255, 255, 255, 0.16);
        --portfolio-scale: 1;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      html.is-anchored-zoom {
        scroll-behavior: auto;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
        overflow-x: auto;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 60px;
        padding: 12px clamp(14px, 3vw, 36px);
        border-bottom: 1px solid var(--line);
        background: rgba(8, 8, 8, 0.86);
        backdrop-filter: blur(14px);
        transition: transform 220ms ease, opacity 220ms ease;
        will-change: transform;
      }

      .site-header.is-hidden {
        opacity: 0;
        transform: translateY(-100%);
      }

      .brand {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(17px, 2vw, 22px);
        font-weight: 650;
        letter-spacing: 0;
        line-height: 1.2;
      }

      .meta {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }

      .download:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .header-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-shrink: 0;
      }

      .zoom-controls {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
      }

      .zoom-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        min-height: 36px;
        border: 0;
        border-radius: 0;
        color: var(--ink);
        background: transparent;
        font: inherit;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .zoom-button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.12);
      }

      .zoom-button:disabled {
        color: rgba(245, 241, 234, 0.32);
        cursor: default;
      }

      .zoom-value {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        min-height: 36px;
        border-right: 1px solid var(--line);
        border-left: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        line-height: 1;
      }

      main {
        width: calc(100vw * var(--portfolio-scale));
        margin: 0 auto;
        padding: clamp(6px, calc(2vw * var(--portfolio-scale)), 22px);
        transition: width 180ms ease, padding 180ms ease;
      }

      html.is-anchored-zoom main {
        transition: none;
      }

      .page {
        margin: 0 0 clamp(10px, 2vw, 22px);
      }

      .page img,
      .video-block video {
        display: block;
        width: 100%;
        height: auto;
        border: 0;
        background: #111111;
      }

      .video-block video {
        aspect-ratio: 16 / 9;
        max-height: calc(100vh - 118px);
        object-fit: contain;
      }

      .video-block {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        margin: 0 0 clamp(10px, 2vw, 22px);
        padding: clamp(14px, 2vw, 24px) 0;
      }

      .video-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin: 0 0 12px;
        color: var(--ink);
        font-size: clamp(15px, 1.8vw, 20px);
        font-weight: 650;
        line-height: 1.3;
      }

      .video-title span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }

      @media (max-width: 720px) {
        .site-header {
          min-height: 54px;
          padding: 10px 12px;
        }

        .meta {
          display: none;
        }

        main {
          padding: 8px;
        }

        .header-actions {
          gap: 6px;
        }

        .download {
          min-height: 34px;
          padding: 0 10px;
        }

        .zoom-controls,
        .zoom-button,
        .zoom-value {
          min-height: 34px;
        }

        .zoom-button {
          width: 32px;
        }

        .zoom-value {
          width: 42px;
        }
      }
    </style>

    <script>
      const header = document.querySelector(".site-header");
      const root = document.documentElement;
      const zoomValue = document.querySelector(".zoom-value");
      const zoomOut = document.querySelector("[data-zoom-out]");
      const zoomIn = document.querySelector("[data-zoom-in]");
      const zoomMin = 0.3;
      const zoomMax = 2.4;
      const buttonZoomStep = 0.05;
      let lastScrollY = window.scrollY;
      let ticking = false;
      let zoom = 1;
      let gestureStartZoom = 1;
      let gestureAnchor = null;
      let lastPointer = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
      };

      try {
        const savedZoom = Number(window.localStorage.getItem("portfolioZoom"));
        if (Number.isFinite(savedZoom)) {
          zoom = savedZoom;
        }
      } catch {
        zoom = 1;
      }

      function clampZoom(value) {
        return Math.max(zoomMin, Math.min(zoomMax, value));
      }

      function getEventPoint(event) {
        const hasPoint = Number.isFinite(event.clientX) && Number.isFinite(event.clientY);
        const x = hasPoint && event.clientX > 0 ? event.clientX : lastPointer.x;
        const y = hasPoint && event.clientY > 0 ? event.clientY : lastPointer.y;
        return { x, y };
      }

      function captureAnchor(point) {
        const x = point?.x ?? window.innerWidth / 2;
        const y = point?.y ?? window.innerHeight / 2;
        const element = document.elementFromPoint(x, y)?.closest(".page, .video-block, main");

        if (!element) {
          return { element: null, x, y, ratioX: 0.5, ratioY: 0.5 };
        }

        const rect = element.getBoundingClientRect();
        const ratioX = rect.width > 0 ? (x - rect.left) / rect.width : 0.5;
        const ratioY = rect.height > 0 ? (y - rect.top) / rect.height : 0.5;
        return {
          element,
          x,
          y,
          ratioX: Math.max(0, Math.min(1, ratioX)),
          ratioY: Math.max(0, Math.min(1, ratioY)),
        };
      }

      function restoreAnchor(anchor) {
        if (!anchor?.element) {
          return;
        }

        window.requestAnimationFrame(() => {
          const rect = anchor.element.getBoundingClientRect();
          const targetX = window.scrollX + rect.left + rect.width * anchor.ratioX;
          const targetY = window.scrollY + rect.top + rect.height * anchor.ratioY;
          window.scrollTo({
            left: targetX - anchor.x,
            top: targetY - anchor.y,
            behavior: "auto",
          });
          lastScrollY = window.scrollY;

          window.requestAnimationFrame(() => {
            root.classList.remove("is-anchored-zoom");
          });
        });
      }

      function setZoom(nextZoom, anchor = null) {
        zoom = Math.round(clampZoom(nextZoom) * 100) / 100;
        root.classList.toggle("is-anchored-zoom", Boolean(anchor));
        root.style.setProperty("--portfolio-scale", String(zoom));
        zoomValue.value = `${Math.round(zoom * 100)}%`;
        zoomValue.textContent = `${Math.round(zoom * 100)}%`;
        zoomOut.disabled = zoom <= zoomMin;
        zoomIn.disabled = zoom >= zoomMax;
        header.classList.remove("is-hidden");

        try {
          window.localStorage.setItem("portfolioZoom", String(zoom));
        } catch {
          // The page still works if the browser blocks local storage on file URLs.
        }

        restoreAnchor(anchor);
      }

      function zoomByDirection(direction) {
        const anchor = captureAnchor(lastPointer);
        setZoom(zoom + buttonZoomStep * direction, anchor);
      }

      function handleWheelZoom(event) {
        if (!event.ctrlKey && !event.metaKey) {
          return;
        }

        event.preventDefault();
        const point = getEventPoint(event);
        lastPointer = point;
        const anchor = captureAnchor(point);
        const zoomFactor = Math.exp(-event.deltaY * 0.002);
        setZoom(zoom * zoomFactor, anchor);
      }

      function handleGestureStart(event) {
        event.preventDefault();
        const point = getEventPoint(event);
        lastPointer = point;
        gestureStartZoom = zoom;
        gestureAnchor = captureAnchor(point);
      }

      function handleGestureChange(event) {
        event.preventDefault();
        setZoom(gestureStartZoom * event.scale, gestureAnchor);
      }

      function handlePointerMove(event) {
        lastPointer = getEventPoint(event);
      }

      zoomOut.addEventListener("click", () => zoomByDirection(-1));
      zoomIn.addEventListener("click", () => zoomByDirection(1));
      window.addEventListener("pointermove", handlePointerMove, { passive: true });
      window.addEventListener("mousemove", handlePointerMove, { passive: true });
      window.addEventListener("wheel", handleWheelZoom, { passive: false });
      window.addEventListener("gesturestart", handleGestureStart, { passive: false });
      window.addEventListener("gesturechange", handleGestureChange, { passive: false });
      setZoom(zoom);

      function updateHeader() {
        const currentScrollY = window.scrollY;
        const delta = currentScrollY - lastScrollY;

        if (currentScrollY <= 8) {
          header.classList.remove("is-hidden");
        } else if (delta > 8) {
          header.classList.add("is-hidden");
        } else if (delta < -8) {
          header.classList.remove("is-hidden");
        }

        lastScrollY = currentScrollY;
        ticking = false;
      }

      window.addEventListener(
        "scroll",
        () => {
          if (!ticking) {
            window.requestAnimationFrame(updateHeader);
            ticking = true;
          }
        },
        { passive: true },
      );
    </script>
