<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>王裕简历</title>
    <meta name="description" content="王裕视觉设计师简历预览">
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --ink: #f7f2ea;
        --muted: #a7a19a;
        --line: rgba(255, 255, 255, 0.16);
        --resume-scale: 1;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 60px;
        padding: 12px clamp(14px, 3vw, 36px);
        border-bottom: 1px solid var(--line);
        background: rgba(10, 10, 10, 0.86);
        backdrop-filter: blur(14px);
        transition: transform 220ms ease, opacity 220ms ease;
        will-change: transform;
      }

      .site-header.is-hidden {
        opacity: 0;
        transform: translateY(-100%);
      }

      .brand {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(17px, 2vw, 22px);
        font-weight: 650;
        letter-spacing: 0;
        line-height: 1.2;
      }

      .meta {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .header-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-shrink: 0;
      }

      .download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }

      .download:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .zoom-controls {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
      }

      .zoom-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        min-height: 36px;
        border: 0;
        border-radius: 0;
        color: var(--ink);
        background: transparent;
        font: inherit;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .zoom-button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.12);
      }

      .zoom-button:disabled {
        color: rgba(247, 242, 234, 0.32);
        cursor: default;
      }

      .zoom-value {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        min-height: 36px;
        border-right: 1px solid var(--line);
        border-left: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        line-height: 1;
      }

      main {
        width: min(calc(100vw * var(--resume-scale)), 1180px);
        margin: 0 auto;
        padding: clamp(8px, calc(2.2vw * var(--resume-scale)), 28px);
        transition: width 180ms ease, padding 180ms ease;
      }

      .page {
        margin: 0;
      }

      .page img {
        display: block;
        width: 100%;
        height: auto;
        border: 0;
        background: #ffffff;
      }

      @media (max-width: 720px) {
        .site-header {
          min-height: 54px;
          padding: 10px 12px;
        }

        .meta {
          display: none;
        }

        .header-actions {
          gap: 6px;
        }

        .download {
          min-height: 34px;
          padding: 0 10px;
        }

        .zoom-controls,
        .zoom-button,
        .zoom-value {
          min-height: 34px;
        }

        .zoom-button {
          width: 32px;
        }

        .zoom-value {
          width: 42px;
        }

        main {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <h1>王裕 视觉设计师简历</h1>
        <p class="meta">Visual Designer Resume</p>
      </div>
      <div class="header-actions">
        <div class="zoom-controls" aria-label="页面缩放">
          <button class="zoom-button" type="button" data-zoom-out aria-label="缩小">-</button>
          <output class="zoom-value" aria-live="polite">100%</output>
          <button class="zoom-button" type="button" data-zoom-in aria-label="放大">+</button>
        </div>
        <a class="download" href="assets/pdf/visual-designer-resume.pdf" download>下载 PDF</a>
      </div>
    </header>

    <main aria-label="视觉设计师简历页面">
      <figure class="page">
        <img src="assets/pages/page-01.jpg" width="1489" height="2105" alt="王裕视觉设计师简历" loading="eager" fetchpriority="high">
      </figure>
    </main>

    <script>
      const header = document.querySelector(".site-header");
      const root = document.documentElement;
      const zoomValue = document.querySelector(".zoom-value");
      const zoomOut = document.querySelector("[data-zoom-out]");
      const zoomIn = document.querySelector("[data-zoom-in]");
      const zoomSteps = [0.35, 0.45, 0.55, 0.7, 0.85, 1, 1.15, 1.35, 1.6, 2];
      let lastScrollY = window.scrollY;
      let ticking = false;
      let zoomIndex = 5;

      try {
        const savedZoom = Number(window.localStorage.getItem("resumeZoom"));
        const savedIndex = zoomSteps.indexOf(savedZoom);
        if (savedIndex >= 0) {
          zoomIndex = savedIndex;
        }
      } catch {
        zoomIndex = 5;
      }

      function setZoom(nextIndex) {
        zoomIndex = Math.max(0, Math.min(zoomSteps.length - 1, nextIndex));
        const zoom = zoomSteps[zoomIndex];
        root.style.setProperty("--resume-scale", String(zoom));
        zoomValue.value = `${Math.round(zoom * 100)}%`;
        zoomValue.textContent = `${Math.round(zoom * 100)}%`;
        zoomOut.disabled = zoomIndex === 0;
        zoomIn.disabled = zoomIndex === zoomSteps.length - 1;
        header.classList.remove("is-hidden");

        try {
          window.localStorage.setItem("resumeZoom", String(zoom));
        } catch {
          // The page still works if the browser blocks local storage on file URLs.
        }
      }

      zoomOut.addEventListener("click", () => setZoom(zoomIndex - 1));
      zoomIn.addEventListener("click", () => setZoom(zoomIndex + 1));
      setZoom(zoomIndex);

      function updateHeader() {
        const currentScrollY = window.scrollY;
        const delta = currentScrollY - lastScrollY;

        if (currentScrollY <= 8) {
          header.classList.remove("is-hidden");
        } else if (delta > 8) {
          header.classList.add("is-hidden");
        } else if (delta < -8) {
          header.classList.remove("is-hidden");
        }

        lastScrollY = currentScrollY;
        ticking = false;
      }

      window.addEventListener(
        "scroll",
        () => {
          if (!ticking) {
            window.requestAnimationFrame(updateHeader);
            ticking = true;
          }
        },
        { passive: true },
      );
    </script>
  </body>
</html>
